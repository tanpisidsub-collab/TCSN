<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>TCSN Executive Command Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg: #070a10; --card: #111827; --accent: #00e5ff; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .command-section { background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #374151; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; background: #030712; color: var(--accent); border: 1px solid #374151; padding: 15px; border-radius: 8px; font-size: 16px; margin-bottom: 10px; }
        .btn-exec { background: var(--accent); color: #000; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #374151; }
        h2 { font-size: 16px; color: var(--accent); margin-bottom: 15px; }
        .log { background: #000; padding: 10px; font-family: monospace; font-size: 13px; color: #10b981; height: 150px; overflow-y: auto; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ระบบสั่งการอัจฉริยะ -->
        <div class="command-section">
            <h2><i class="fa-solid fa-terminal"></i> พิมพ์คำสั่งสั่งการ (Universal Command Prompt)</h2>
            <textarea id="commandInput" placeholder="ตัวอย่าง: CDC ตรวจสอบสถานะความปลอดภัยล่าสุด หรือ ทุกศูนย์ รายงานสรุปภารกิจ 10 นาที"></textarea>
            <button class="btn-exec" onclick="processCommand()"><i class="fa-solid fa-paper-plane"></i> ส่งคำสั่งไปยังหน่วยงาน</button>
        </div>

        <!-- หน้าต่างติดตามสถานะ -->
        <div class="dashboard-grid">
            <div class="panel">
                <h2><i class="fa-solid fa-list-check"></i> ภารกิจที่กำลังดำเนินการ</h2>
                <div id="taskList" style="font-size: 14px;">- ยังไม่มีภารกิจค้าง</div>
            </div>
            <div class="panel">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> ประวัติการสั่งการ (Logs)</h2>
                <div class="log" id="logBox">[System] Ready to serve, Commander.</div>
            </div>
        </div>
    </div>

    <script>
        function processCommand() {
            const input = document.getElementById('commandInput').value;
            const logBox = document.getElementById('logBox');
            const taskList = document.getElementById('taskList');
            const timestamp = new Date().toLocaleTimeString();

            if (!input) return alert("โปรดระบุคำสั่งครับท่านประธาน");

            // อัปเดต Log
            logBox.innerHTML += `<br>[${timestamp}] Executing: ${input}`;
            
            // อัปเดต Task List
            taskList.innerHTML = `<div><i class="fa-solid fa-spinner fa-spin"></i> ${input}</div>`;
            
            alert("คำสั่งถูกกระจายไปยังหน่วยงานที่เกี่ยวข้องเรียบร้อยแล้วครับท่านประธาน!");
            document.getElementById('commandInput').value = '';
        }
    </script>
</body>
</html>
