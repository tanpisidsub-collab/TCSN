<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCSN | Thai Cyber Security Normal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="border-b border-slate-800 bg-slate-900/50 p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl uppercase tracking-widest text-cyan-400">TCSN</h1>
            <div class="space-x-4 text-sm">
                <button onclick="show('home')" class="hover:text-cyan-400">หน้าแรก</button>
                <button onclick="show('about')" class="hover:text-cyan-400">เกี่ยวกับเรา</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto p-6 w-full">
        <div id="home">
            <h2 class="text-3xl font-bold mb-6 uppercase">ยินดีต้อนรับสู่ TCSN</h2>
            <p class="text-slate-400 mb-8">มาตรฐานใหม่แห่งความปลอดภัยไซเบอร์ ภายใต้การบริหารจัดการระดับมืออาชีพ</p>
        </div>
        <div id="about" class="hidden">
            <h2 class="text-3xl font-bold mb-6 uppercase">เกี่ยวกับเรา</h2>
            <p class="text-slate-400">องค์กรอิสระที่มุ่งเน้นความปลอดภัยทางไซเบอร์เพื่อสังคมและธุรกิจอย่างครบวงจร</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 p-6 text-center text-xs text-slate-600 uppercase tracking-widest">
        &copy; 2026 Thai Cyber Security Normal.
    </footer>

    <script>
        function show(id) {
            document.getElementById('home').classList.add('hidden');
            document.getElementById('about').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
